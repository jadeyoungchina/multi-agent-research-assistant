name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DASHSCOPE_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*-requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install upstream dependencies
        run: python -m pip install -r requirements/upstream-requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements/project-requirements.txt
      - name: Run offline tests
        run: python -m pytest -m "not live" -q
      - name: Verify repository integrity
        run: python scripts/verify_repository.py
      - name: Run deterministic benchmark gate
        run: python -m app.evaluation.cli --provider fake --variants all --output-dir artifacts/evaluation/fake --enforce-gate
        env:
          CHAT_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
      - name: Exercise real-document evaluation offline
        run: python -m app.evaluation.cli --provider fake --real-manifest benchmarks/real-v1/corpus-manifest.json --split dev --allow-ai-reviewed --limit 5 --output-dir artifacts/evaluation/real-v1-fake
      - name: Upload benchmark evidence when generated
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: fake-benchmark
          path: artifacts/evaluation/fake
          if-no-files-found: ignore
